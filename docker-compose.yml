services:
  api:
    build:
      context: .
      target: runtime
    image: buoy-telemetry-recovery:latest
    environment:
      # Single knob: the server binds this port inside the container AND it
      # is published to the same port on the host. Override on the host with
      # e.g.  API_PORT=8080 docker compose up --build
      API_PORT: "${API_PORT:-3000}"
      API_HOST: "0.0.0.0"
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: buoy-telemetry-verify:latest
    environment:
      # Reach the api service over the compose network on its configured port.
      API_BASE_URL: "http://api:${API_PORT:-3000}"
      HEALTH_TIMEOUT_SECONDS: "120"
    depends_on:
      api:
        condition: service_healthy
    # One-shot: run the pipeline once and stop with its exit code.
    restart: "no"
